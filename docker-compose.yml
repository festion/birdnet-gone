version: '3.8'

services:
  # BirdNET-Go Service
  birdnet-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birdnet-go
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./config:/config
    environment:
      - TZ=UTC
    networks:
      - birdnet

networks:
  birdnet:
    driver: bridge
