version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Tracks the Dockerfile Go base image (golang:<ver>-trixie) so it can't
  # silently drift from go.mod's `go` directive. No group / manual merge —
  # a base-image bump usually pairs with a go.mod bump and wants review.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps-docker)"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "build(deps-frontend)"
    open-pull-requests-limit: 5
    groups:
      vite-toolchain:
        # vite and its framework plugin declare peer ranges on each other, so a
        # major in one CANNOT be installed without the matching major in the
        # other -- npm fails with ERESOLVE. Dependabot opening them as separate
        # PRs produces two permanently-unmergeable PRs that reopen forever.
        # Grouping them means one coherent, installable PR. Measured 2026-07-30.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "@sveltejs/vite-plugin-*"
          - "rollup"
        update-types:
          - "major"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
