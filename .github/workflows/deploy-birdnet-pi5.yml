name: Deploy BirdNET-Go to Pi 5

# Cross-compiles linux_arm64 on a GitHub-hosted runner, then SSHes from the
# self-hosted runner (192.168.1.182) into the Pi 5 (192.168.10.246) to perform
# an atomic-swap deploy of the binary. The Pi 5 lives on the IoT VLAN, which
# only the self-hosted runner can reach — that's why this workflow is split
# into two jobs.
#
# Triggered manually (workflow_dispatch). Once we've validated a few clean
# deploys, the trigger can be widened to `push: branches: [main]` with
# paths-ignore for docs/lint-only changes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and deploy (default: main)'
        required: false
        default: 'main'
      skip_verify:
        description: 'Skip post-deploy endpoint verification'
        type: boolean
        default: false
      skip_pushover:
        description: 'Skip Pushover notification'
        type: boolean
        default: false

env:
  PI_HOST: 192.168.10.246
  PI_USER: jeremy
  SERVICE: birdnet-go-native.service
  BINARY_PATH: /usr/local/bin/birdnet-go

permissions:
  contents: read

jobs:
  build:
    name: Build linux_arm64
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ARM64 cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config gcc-aarch64-linux-gnu

      - name: Compute build version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build linux_arm64
        env:
          CGO_ENABLED: 1
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: task linux_arm64

      - name: Verify binary
        run: |
          file bin/birdnet-go
          test -x bin/birdnet-go
          # Confirm it's actually ARM64
          file bin/birdnet-go | grep -q "ARM aarch64" || { echo "Binary is not ARM aarch64"; exit 1; }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: birdnet-go-linux_arm64
          path: bin/birdnet-go
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to Pi 5
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # ServerAliveInterval keeps the connection alive during longer-running
      # operations (e.g., systemctl stop takes 8-10s on this Pi). The first
      # CI run failed exit-255 mid-stream without these.
      SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v6
        with:
          name: birdnet-go-linux_arm64
          path: ./artifact

      # SSH options shared across deploy steps. ServerAliveInterval keeps the
      # connection alive during long-running operations like systemctl stop,
      # which sometimes takes 8-10s on this Pi and can otherwise cause the
      # control socket to be reaped mid-stream by intermediate routers.
      - name: Stage binary on Pi
        run: |
          chmod +x artifact/birdnet-go
          scp ${SSH_OPTS} artifact/birdnet-go "${PI_USER}@${PI_HOST}:/tmp/birdnet-go-new"

      # The deploy is split into small SSH calls instead of one long script
      # because earlier attempts hit "exit code 255" (SSH session dropped)
      # right around the systemctl stop step. Each step here completes in a
      # second or two — well inside the keepalive window — and the Pi state
      # is well-defined between calls so we can re-run safely.
      - name: Capture current version for backup
        id: cur_ver
        run: |
          CUR_VER=$(ssh ${SSH_OPTS} "${PI_USER}@${PI_HOST}" "${BINARY_PATH} --version 2>&1 | head -1 | grep -oE 'version=[a-zA-Z0-9.-]+' | cut -d= -f2")
          echo "cur_ver=${CUR_VER}" >> "$GITHUB_OUTPUT"
          echo "current version: ${CUR_VER}"

      - name: Stop service and kill orphans
        # CRITICAL: do NOT use `pkill -f 'birdnet-go realtime'` here — the
        # search pattern would match this very wrapper bash's own cmdline
        # (because the pattern travels through the ssh command), and pkill
        # would kill its own parent shell. SSH then drops exit 255 as the
        # service finishes stopping. Use exact-name match instead so only
        # actual birdnet-go processes match.
        run: |
          ssh ${SSH_OPTS} "${PI_USER}@${PI_HOST}" "sudo systemctl stop ${SERVICE} && sudo pkill -9 -x birdnet-go 2>/dev/null || true"

      - name: Backup current binary and install new
        env:
          CUR_VER: ${{ steps.cur_ver.outputs.cur_ver }}
        run: |
          ssh ${SSH_OPTS} "${PI_USER}@${PI_HOST}" "sudo cp -p ${BINARY_PATH} ${BINARY_PATH}.${CUR_VER} && sudo install -m 755 /tmp/birdnet-go-new ${BINARY_PATH} && rm -f /tmp/birdnet-go-new"
          echo "backup: ${BINARY_PATH}.${CUR_VER}"

      - name: Start service
        run: |
          NEW_VER=$(ssh ${SSH_OPTS} "${PI_USER}@${PI_HOST}" "${BINARY_PATH} --version 2>&1 | head -1 | grep -oE 'version=[a-zA-Z0-9.-]+' | cut -d= -f2")
          echo "new version: ${NEW_VER}"
          ssh ${SSH_OPTS} "${PI_USER}@${PI_HOST}" "sudo systemctl start ${SERVICE}"
          sleep 8
          ssh ${SSH_OPTS} "${PI_USER}@${PI_HOST}" "sudo systemctl is-active ${SERVICE}"

      - name: Verify health
        if: ${{ !inputs.skip_verify }}
        run: |
          # Give the service a moment to bind sockets after start, then probe
          # the health endpoint and the VicoHome route that PR #73 added.
          # Both must return 200; a partial failure means we should investigate.
          sleep 10
          for i in 1 2 3 4 5; do
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${PI_HOST}:8080/api/v2/health" || true)
            [ "$HEALTH" = "200" ] && break
            echo "health probe attempt $i: HTTP $HEALTH (retrying)"
            sleep 3
          done
          [ "$HEALTH" = "200" ] || { echo "Health check failed: HTTP $HEALTH"; exit 1; }

          VH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${PI_HOST}:8080/api/v2/vicohome/images" || true)
          [ "$VH" = "200" ] || { echo "VicoHome endpoint regressed: HTTP $VH"; exit 1; }

          echo "✅ Health 200, VicoHome 200"

      - name: Pushover notification (success)
        if: ${{ success() && !inputs.skip_pushover }}
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          curl -s --max-time 10 \
            --form-string "token=${PUSHOVER_TOKEN}" \
            --form-string "user=${PUSHOVER_USER}" \
            --form-string "title=BirdNET-Go deployed to Pi 5" \
            --form-string "message=Version ${VERSION} is live on ${PI_HOST}." \
            --form-string "priority=-1" \
            https://api.pushover.net/1/messages.json > /dev/null

      - name: Pushover notification (failure)
        if: ${{ failure() && !inputs.skip_pushover }}
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          curl -s --max-time 10 \
            --form-string "token=${PUSHOVER_TOKEN}" \
            --form-string "user=${PUSHOVER_USER}" \
            --form-string "title=BirdNET-Go deploy FAILED" \
            --form-string "message=Version ${VERSION} failed to deploy to ${PI_HOST}. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json > /dev/null
