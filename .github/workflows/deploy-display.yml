name: Deploy Display to Pi

on:
  push:
    branches: [main]
    paths:
      - 'display/**'
      - '.github/workflows/deploy-display.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to BirdNET Pi
        env:
          PI_HOST: 192.168.1.197
          PI_USER: jeremy
        run: |
          echo "Deploying display to $PI_HOST..."

          # Sync display files (excluding cache, runtime files, and venv)
          rsync -avz --delete \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            --exclude='display_config.json' \
            --exclude='pinned_species.json' \
            --exclude='static/bird_images_cache' \
            --exclude='venv' \
            --exclude='*.backup' \
            --exclude='*_original.*' \
            display/ ${PI_USER}@${PI_HOST}:~/birdnet_display/

          echo "Files synced successfully"

      - name: Setup Python venv
        env:
          PI_HOST: 192.168.1.197
          PI_USER: jeremy
        run: |
          ssh ${PI_USER}@${PI_HOST} "cd ~/birdnet_display && python3 -m venv venv && source venv/bin/activate && pip install -q flask requests qrcode pillow pyyaml beautifulsoup4"

      - name: Restart display service
        env:
          PI_HOST: 192.168.1.197
          PI_USER: jeremy
        run: |
          ssh ${PI_USER}@${PI_HOST} "pkill -f birdnet_display.py || true; cd ~/birdnet_display && source venv/bin/activate && nohup python3 birdnet_display.py > /tmp/display.log 2>&1 &"
          sleep 5
          ssh ${PI_USER}@${PI_HOST} "curl -s http://localhost:5000 > /dev/null && echo 'Display service is running' || echo 'Warning: Display may not be responding'"

      - name: Restart kiosk browser
        env:
          PI_HOST: 192.168.1.197
          PI_USER: jeremy
        run: |
          ssh ${PI_USER}@${PI_HOST} "pkill chromium || true; sleep 2; XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=wayland-0 nohup /usr/bin/chromium --ozone-platform=wayland --password-store=basic --noerrdialogs --disable-infobars --kiosk http://localhost:5000 > /tmp/chromium.log 2>&1 &"
          echo "Kiosk browser restarted"

      - name: Verify deployment
        env:
          PI_HOST: 192.168.1.197
          PI_USER: jeremy
        run: |
          sleep 5
          ssh ${PI_USER}@${PI_HOST} "curl -s http://localhost:5000/data | head -c 200"
          echo ""
          echo "Deployment complete at $(date)"
