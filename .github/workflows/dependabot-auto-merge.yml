name: Dependabot auto-merge

# birdnet-gone can't use the branch-protection `--auto` pattern: its CI checks
# (`golangci / lint`, `Frontend Quality Checks`) are path-filtered, so requiring
# one in branch protection would block non-matching human PRs. So we gate
# in-workflow: for a Dependabot patch/minor PR, wait until THE check that gates
# this PR's ecosystem is green (and every other check has settled with no
# failure), then squash-merge — pinned to the polled head SHA.
#
# Required check is keyed off the Dependabot `directory`:
#   /          -> "golangci / lint"          (gomod)
#   /frontend  -> "Frontend Quality Checks"  (npm)
# Any other directory (e.g. github-actions at /) has no mapped gate and is left
# for manual merge. A failed/red check also leaves the PR for manual review.
#
# Merge uses DEPENDABOT_AUTOMERGE_TOKEN (a Dependabot secret), not GITHUB_TOKEN.
# Pi 5 deploy is a separate manual workflow_dispatch, so this never touches
# hardware. `concurrency` cancels a stale poll when Dependabot rebases the PR.

on: pull_request

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Gate on the ecosystem's check, then squash-merge patch/minor
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          DIR: ${{ steps.metadata.outputs.directory }}
          SELF: dependabot-auto-merge
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail
          case "$DIR" in
            /)         REQUIRED="golangci / lint" ;;
            /frontend) REQUIRED="Frontend Quality Checks" ;;
            *) echo "No gate mapped for directory '$DIR' — manual merge."; exit 0 ;;
          esac
          echo "Gating on required check: '$REQUIRED'"
          api_fail=0
          for i in $(seq 1 60); do
            # Do NOT swallow the API error. `2>/dev/null || echo ""` made a
            # failed call look identical to "no checks started yet", so a dead
            # or under-scoped token read as "required check never ran" and the
            # gate quietly declined to merge. Measured 2026-08-04: the check
            # had actually started within ~10s.
            if lines=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
                 --paginate --jq '.check_runs[] | select(.name != env.SELF)
                   | [.name, .status, (.conclusion // "")] | @tsv' \
                 2>/tmp/check_runs_err); then
              api_fail=0
            else
              api_fail=$((api_fail + 1))
              echo "poll $i: check-runs API FAILED (attempt $api_fail):"
              head -c 300 /tmp/check_runs_err
              if [ "$api_fail" -ge 3 ]; then
                echo "check-runs API failed $api_fail times in a row. The gate"
                echo "cannot evaluate this PR: that is an API/permission fault,"
                echo "NOT a missing check. Leaving PR for manual review."
                exit 0
              fi
              sleep 30
              continue
            fi
            pending=0; failed=0; req_ok=0; req_seen=0
            while IFS=$'\t' read -r name status conclusion; do
              [ -z "$status" ] && continue
              [ "$name" = "$REQUIRED" ] && req_seen=1
              if [ "$status" != "completed" ]; then pending=$((pending + 1)); continue; fi
              case "$conclusion" in
                success)         [ "$name" = "$REQUIRED" ] && req_ok=1 ;;
                skipped|neutral) : ;;
                *)               failed=$((failed + 1)) ;;
              esac
            done <<< "$lines"
            echo "poll $i: req_seen=$req_seen req_ok=$req_ok pending=$pending failed=$failed"
            if [ "$failed" -gt 0 ]; then
              echo "A check failed — leaving PR for manual review."; exit 0
            fi
            if [ "$req_ok" -eq 1 ] && [ "$pending" -eq 0 ]; then
              echo "Required check green and all checks settled — squash-merging."
              gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"; exit 0
            fi
            # 6 polls x 30s = 3 min was too tight: measured 2026-08-04, the
            # required check completed ~20s AFTER this bail fired, so the gate
            # gave up on a PR that was about to go green. 20 polls = 10 min.
            if [ "$i" -ge 20 ] && [ "$req_seen" -eq 0 ]; then
              echo "Required check '$REQUIRED' has not appeared after $i polls"
              echo "(~$((i * 30 / 60)) min) — leaving for manual merge."
              exit 0
            fi
            sleep 30
          done
          echo "Checks did not settle within timeout — leaving PR for manual review."; exit 0
