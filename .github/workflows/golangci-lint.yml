name: golangci-lint

concurrency:
  group: golangci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      # ops #2869 - a change to THIS file must re-run THIS workflow. Without
      # it a workflow-only PR (such as the one that added the retried install
      # step below) is merged having never executed the thing it edits.
      - '.github/workflows/golangci-lint.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/golangci-lint.yml'
  workflow_call:

permissions:
  contents: read
  #pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - run: go version

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache TensorFlow headers
        uses: actions/cache@v6
        with:
          path: ~/src/tensorflow
          key: ${{ runner.os }}-tensorflow-v2.17.1

      - name: Install dependencies
        run: task check-tensorflow
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
      
      - name: Set environment variables for CGO
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I $HOME/src/tensorflow" >> $GITHUB_ENV

      # ops #2869 - install the linter ourselves, with retries, rather than
      # letting the action single-shot the releases CDN.
      #
      # 2026-08-12, run 31644092113: the action's own download returned
      # "socket hang up" and this job reported FAILURE with ZERO `.go:NN`
      # diagnostics in the whole log - nothing was linted. Because
      # docker-build.yml gates `build-and-push-docker-image` on
      # `needs: golangci`, the dev container image for that commit (the one
      # that landed gitleaks secret scanning) was never built, and main stayed
      # red for ~28h before a human noticed. "lint could not download its
      # binary" and "lint found problems" are different conditions that were
      # indistinguishable from this job's conclusion.
      #
      # This does NOT change what gates the build - a real lint failure still
      # fails the job. It takes the transient out of the equation, and when the
      # download does fail terminally it fails in a step whose name says so.
      - name: Install golangci-lint (retried, checksum-verified)
        env:
          # The action below runs whatever is on PATH, so with install-mode
          # `none` this env var is the single source of the version.
          GOLANGCI_LINT_VERSION: v2.12.2
        run: |
          set -euo pipefail
          ver="${GOLANGCI_LINT_VERSION#v}"
          dir="golangci-lint-${ver}-linux-amd64"
          tarball="${dir}.tar.gz"
          base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
          fetch() {
            curl --fail --location --silent --show-error \
                 --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 15 --output "$1" "$2"
          }
          tmp="$(mktemp -d)"
          fetch "${tmp}/${tarball}" "${base}/${tarball}"
          fetch "${tmp}/checksums.txt" \
                "${base}/golangci-lint-${ver}-checksums.txt"
          # grep exits non-zero when the asset name is absent, and
          # `sha256sum -c` rejects an empty list - so an upstream rename fails
          # here loudly instead of silently skipping verification. Both of
          # those directions were exercised before this shipped.
          ( cd "$tmp" && grep " ${tarball}\$" checksums.txt > tarball.sha256 \
              && sha256sum --check tarball.sha256 )
          tar -xzf "${tmp}/${tarball}" -C "$tmp"
          sudo install -m 0755 "${tmp}/${dir}/golangci-lint" \
               /usr/local/bin/golangci-lint
          rm -rf "$tmp"
          golangci-lint --version

      - name: golangci-lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # `none` = run the golangci-lint already on PATH, installed above with
          # retries. In this mode the action ignores the `version` input, so it
          # is deliberately not set here; the version lives in the install
          # step's env, in one place.
          install-mode: none
          # Show only new issues by default
          only-new-issues: false
          # Additional args for better output (v2.5.0+ syntax)
          args: --output.checkstyle.path=golangci-lint-report.xml

      - name: Generate lint summary
        if: always()
        run: |
          if [ -f golangci-lint-report.xml ]; then
            # Count issues by severity
            ERROR_COUNT=$(grep -o 'severity="error"' golangci-lint-report.xml | wc -l)
            WARNING_COUNT=$(grep -o 'severity="warning"' golangci-lint-report.xml | wc -l)
            TOTAL=$((ERROR_COUNT + WARNING_COUNT))

            if [ $TOTAL -gt 0 ]; then
              echo "## :warning: Linting Issues Found" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **Errors:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
              echo "- **Warnings:** $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
              echo "- **Total:** $TOTAL" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Extract unique linters that reported issues
              echo "### Issues by Linter" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -oP 'source="\K[^"]+' golangci-lint-report.xml | sort | uniq -c | sort -rn >> $GITHUB_STEP_SUMMARY || echo "Unable to parse linters" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Show sample of issues (first 10 errors)
              echo "### Sample Issues (First 10 Errors)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep 'severity="error"' golangci-lint-report.xml | head -10 | \
                sed -E 's/.*file="([^"]+)".*line="([^"]+)".*message="([^"]+)".*source="([^"]+)".*/\1:\2 [\4] \3/' >> $GITHUB_STEP_SUMMARY || echo "No errors to display" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📋 **Check the annotations above for the complete list**" >> $GITHUB_STEP_SUMMARY
            else
              echo "## :white_check_mark: No Linting Issues" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "All checks passed!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## :white_check_mark: Linting Completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No issues found or linter did not generate report." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golangci-lint-report
          path: golangci-lint-report.xml
          if-no-files-found: ignore