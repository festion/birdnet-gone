name: golangci-lint

concurrency:
  group: golangci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      # ops #2869 - a change to THIS file must re-run THIS workflow. Without
      # it a workflow-only PR (such as the one that added the retried install
      # step below) is merged having never executed the thing it edits.
      - '.github/workflows/golangci-lint.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/golangci-lint.yml'
  workflow_call:

permissions:
  contents: read
  #pull-requests: read

jobs:
  # ops #2869 - the frontend build is its OWN job, because a frontend build
  # failure is not a lint failure.
  #
  # Measured 2026-08-21 over the 32 lint-job failures whose logs had not yet
  # expired: 13 of them - 41% - were `Build Frontend` failing with
  # golangci-lint SKIPPED. The linter never ran, yet the job reported a lint
  # failure, and via `needs: golangci` in docker-build.yml that also suppressed
  # the container image. Unlike the 2026-08-12 download hang-up this is not a
  # transient: it recurs on every frontend dependency bump that does not build.
  #
  # This does NOT loosen the gate. If `frontend` fails, `golangci` is skipped,
  # the called workflow still fails, and the image is still suppressed - there
  # is no window in which an image publishes unlinted. What changes is that the
  # red job is named for what actually broke, and `lint` now means lint.
  frontend:
    name: frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # `frontend/dist` is gitignored and NOTHING is tracked under it (the
      # `!dist/.gitkeep` negation in frontend/.gitignore never took effect - the
      # file was never added). So `//go:embed all:dist` in frontend/embed.go
      # cannot COMPILE on a fresh checkout, and the lint job genuinely needs
      # these bytes. `if-no-files-found: error` so an empty build fails here
      # rather than downstream as a confusing compile error.
      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  golangci:
    name: lint
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - run: go version

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache TensorFlow headers
        uses: actions/cache@v6
        with:
          path: ~/src/tensorflow
          key: ${{ runner.os }}-tensorflow-v2.17.1

      - name: Install dependencies
        run: task check-tensorflow

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      # A positive control on the artifact, not decoration. If the download
      # silently produced nothing, `//go:embed all:dist` would fail to compile
      # and surface as a golangci-lint error - i.e. exactly the
      # not-really-a-lint-failure this card is about, reintroduced through the
      # new plumbing. Fail here, in a step whose name says what is wrong.
      - name: Assert the embedded frontend is present
        run: |
          set -euo pipefail
          test -d frontend/dist || { echo "frontend/dist missing after download"; exit 1; }
          n="$(find frontend/dist -type f | wc -l)"
          echo "frontend/dist contains ${n} file(s)"
          [ "$n" -gt 0 ] || { echo "frontend/dist is EMPTY - the embed cannot compile"; exit 1; }

      - name: Set environment variables for CGO
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I $HOME/src/tensorflow" >> $GITHUB_ENV

      # ops #2869 - install the linter ourselves, with retries, rather than
      # letting the action single-shot the releases CDN.
      #
      # 2026-08-12, run 31644092113: the action's own download returned
      # "socket hang up" and this job reported FAILURE with ZERO `.go:NN`
      # diagnostics in the whole log - nothing was linted. Because
      # docker-build.yml gates `build-and-push-docker-image` on
      # `needs: golangci`, the dev container image for that commit (the one
      # that landed gitleaks secret scanning) was never built, and main stayed
      # red for ~28h before a human noticed. "lint could not download its
      # binary" and "lint found problems" are different conditions that were
      # indistinguishable from this job's conclusion.
      #
      # This does NOT change what gates the build - a real lint failure still
      # fails the job. It takes the transient out of the equation, and when the
      # download does fail terminally it fails in a step whose name says so.
      - name: Install golangci-lint (retried, checksum-verified)
        env:
          # The action below runs whatever is on PATH, so with install-mode
          # `none` this env var is the single source of the version.
          GOLANGCI_LINT_VERSION: v2.12.2
        run: |
          set -euo pipefail
          ver="${GOLANGCI_LINT_VERSION#v}"
          dir="golangci-lint-${ver}-linux-amd64"
          tarball="${dir}.tar.gz"
          base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
          fetch() {
            curl --fail --location --silent --show-error \
                 --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 15 --output "$1" "$2"
          }
          tmp="$(mktemp -d)"
          fetch "${tmp}/${tarball}" "${base}/${tarball}"
          fetch "${tmp}/checksums.txt" \
                "${base}/golangci-lint-${ver}-checksums.txt"
          # grep exits non-zero when the asset name is absent, and
          # `sha256sum -c` rejects an empty list - so an upstream rename fails
          # here loudly instead of silently skipping verification. Both of
          # those directions were exercised before this shipped.
          ( cd "$tmp" && grep " ${tarball}\$" checksums.txt > tarball.sha256 \
              && sha256sum --check tarball.sha256 )
          tar -xzf "${tmp}/${tarball}" -C "$tmp"
          sudo install -m 0755 "${tmp}/${dir}/golangci-lint" \
               /usr/local/bin/golangci-lint
          rm -rf "$tmp"
          golangci-lint --version

      - name: golangci-lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # `none` = run the golangci-lint already on PATH, installed above with
          # retries. In this mode the action ignores the `version` input, so it
          # is deliberately not set here; the version lives in the install
          # step's env, in one place.
          install-mode: none
          # Show only new issues by default
          only-new-issues: false
          # Additional args for better output (v2.5.0+ syntax)
          args: --output.checkstyle.path=golangci-lint-report.xml

      # ops #2869 - the `else` arm below used to print a white check mark and
      # "Linting Completed" whenever no report file existed. A missing report
      # means one of two opposite things: the linter ran and found nothing, or
      # the linter never ran at all. Reporting the second as the first is the
      # "green having linted nothing" hazard this card was filed about,
      # arriving through the summary instead of the job status. The lint step's
      # own outcome is what tells them apart.
      - name: Generate lint summary
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.golangci-lint.outcome }}
        run: |
          if [ -f golangci-lint-report.xml ]; then
            # Count issues by severity
            ERROR_COUNT=$(grep -o 'severity="error"' golangci-lint-report.xml | wc -l)
            WARNING_COUNT=$(grep -o 'severity="warning"' golangci-lint-report.xml | wc -l)
            TOTAL=$((ERROR_COUNT + WARNING_COUNT))

            if [ $TOTAL -gt 0 ]; then
              echo "## :warning: Linting Issues Found" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **Errors:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
              echo "- **Warnings:** $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
              echo "- **Total:** $TOTAL" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Extract unique linters that reported issues
              echo "### Issues by Linter" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -oP 'source="\K[^"]+' golangci-lint-report.xml | sort | uniq -c | sort -rn >> $GITHUB_STEP_SUMMARY || echo "Unable to parse linters" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Show sample of issues (first 10 errors)
              echo "### Sample Issues (First 10 Errors)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep 'severity="error"' golangci-lint-report.xml | head -10 | \
                sed -E 's/.*file="([^"]+)".*line="([^"]+)".*message="([^"]+)".*source="([^"]+)".*/\1:\2 [\4] \3/' >> $GITHUB_STEP_SUMMARY || echo "No errors to display" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📋 **Check the annotations above for the complete list**" >> $GITHUB_STEP_SUMMARY
            else
              echo "## :white_check_mark: No Linting Issues" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "All checks passed!" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${LINT_OUTCOME}" = "success" ]; then
            echo "## :white_check_mark: Linting Completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "golangci-lint succeeded and produced no report file." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: golangci-lint did NOT complete (outcome: ${LINT_OUTCOME})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No report was produced because the linter did not run to" >> $GITHUB_STEP_SUMMARY
            echo "completion. **This is not a clean result** - nothing was linted." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golangci-lint-report
          path: golangci-lint-report.xml
          if-no-files-found: ignore