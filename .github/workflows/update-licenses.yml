name: Update Licenses

on:
  push:
    paths:
      - 'go.mod'
      - 'go.sum'
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the commit can rebase pre-push

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Generate LICENSES.md
        run: |
          # Create frontend/static directory if it doesn't exist
          mkdir -p frontend/static

          echo "# Licenses" > frontend/static/LICENSES.md
          echo "" >> frontend/static/LICENSES.md
          echo "## BirdNET-Go" >> frontend/static/LICENSES.md
          echo "" >> frontend/static/LICENSES.md
          echo "Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International" >> frontend/static/LICENSES.md
          echo "https://creativecommons.org/licenses/by-nc-sa/4.0/" >> frontend/static/LICENSES.md
          echo "" >> frontend/static/LICENSES.md
          echo "## Dependencies" >> frontend/static/LICENSES.md
          echo "" >> frontend/static/LICENSES.md

          # Get licenses excluding internal packages unless they have a LICENSE file
          go-licenses csv github.com/tphakala/birdnet-go/... | while IFS=, read -r package license source; do
            # Skip internal packages and cmd packages unless they contain a LICENSE file
            if [[ $package == *"/internal/"* || $package == *"/cmd/"* ]] && ! [[ -f "${source}/LICENSE" ]]; then
              continue
            fi

            # Skip the main module
            if [[ $package == "github.com/tphakala/birdnet-go" ]]; then
              continue
            fi

            echo "### $package" >> frontend/static/LICENSES.md
            echo "" >> frontend/static/LICENSES.md
            echo "License: $license" >> frontend/static/LICENSES.md
            echo "Source: $source" >> frontend/static/LICENSES.md
            echo "" >> frontend/static/LICENSES.md
          done

          # Create a symbolic link in root directory
          ln -sf frontend/static/LICENSES.md LICENSES.md

      - name: Format LICENSES.md
        working-directory: frontend
        run: npx prettier --write static/LICENSES.md

      - name: Commit updated licenses to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/static/LICENSES.md LICENSES.md
          if git diff --cached --quiet; then
            echo "No license changes to commit."
            exit 0
          fi
          # [skip ci]: docs-only commit; avoids re-triggering unfiltered
          # push workflows (deploy-birdnet-pi5 / docker-build).
          git commit -m "docs: update dependency licenses [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
