; PlatformIO Project Configuration File
;
; BirdNET-Gone ESP32-C6 Wireless Microphone
; XIAO ESP32-C6 + ICS-43434 I2S Microphone
;

[env:esp32c6]
; Use pioarduino platform for better ESP32-C6 support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-C6 specific settings
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L

lib_deps =
    mathieucarbou/ESPAsyncWebServer@^3.3.23
lib_ignore =
    AsyncTCP_RP2040W
    ESPAsyncTCP-esphome

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; OTA upload environment - use: pio run -e esp32c6_ota -t upload
[env:esp32c6_ota]
extends = env:esp32c6
upload_protocol = espota
upload_port = 192.168.1.131
upload_flags =
    --port=3232
